<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="cfGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="cfGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C2410C" stop-opacity="0.4" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background subtle warm hex/circle badge -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#cfGlow)" opacity="0.15" />
  <rect x="12" y="12" width="96" height="96" rx="26" stroke="url(#cfGradient)" stroke-width="2.5" stroke-opacity="0.35" fill="#120E0C" />

  <!-- Shield & Campus Pillar Core -->
  <path d="M60 26L84 37V62C84 76.5 73.8 89.2 60 94C46.2 89.2 36 76.5 36 62V37L60 26Z" fill="url(#cfGradient)" opacity="0.2" />
  <path d="M60 26L84 37V62C84 76.5 73.8 89.2 60 94C46.2 89.2 36 76.5 36 62V37L60 26Z" stroke="url(#cfGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Smart Wrench & Flash Beacon -->
  <!-- Diagonal Wrench Head -->
  <path d="M47 49C44.5 51.5 44.5 55.5 47 58L62 73C64.5 75.5 68.5 75.5 71 73C73.5 70.5 73.5 66.5 71 64L56 49C53.5 46.5 49.5 46.5 47 49Z" fill="url(#cfGradient)" />
  
  <!-- Campus Academic Pillars Overlay -->
  <line x1="52" y1="46" x2="52" y2="70" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <line x1="60" y1="40" x2="60" y2="76" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <line x1="68" y1="46" x2="68" y2="70" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

  <!-- Spark Pulse Dot -->
  <circle cx="60" cy="33" r="3.5" fill="#FBBF24" filter="url(#glowFilter)" />
</svg>
